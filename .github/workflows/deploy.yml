name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: SSH and Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /path/to/your/project/rfi_vps_version
            git pull origin main
            source venv/bin/activate
            pip install -r requirements.txt
            # Restart command (example using pm2 or systemd)
            # pm2 restart rfi-backend || pm2 start api/main.py --name rfi-backend
            # systemctl restart rfi-assistant
