        .oauth-status {

            padding: var(--space-4);

            border-radius: var(--radius-md);

        .status-online-large {

    <!-- JavaScript -->
    <script src="js/api.js"></script>
    <script>
        const API_BASE = window.RFQAgentAPI.baseURL;

        async function configureGmail() {
            console.log('[Settings] Opening Gmail OAuth login flow...');
            try {
                const response = await fetch(API_BASE + '/api/gmail/oauth/login');
                const data = await response.json();
                if (data.auth_url) {
                    window.open(data.auth_url, '_blank');
                } else {
                    window.RFQAgentAPI.showToast('Could not get authentication URL', 'error');
                }
            } catch (error) {
                console.error('[Settings] Gmail OAuth Error:', error);
                window.RFQAgentAPI.showToast('API Connection Error', 'error');
            }
        }

        async function viewOutlookSettings() {
            console.log('[Settings] Opening Outlook OAuth login flow...');
            try {
                const response = await fetch(API_BASE + '/api/oauth/login');
                const data = await response.json();
                if (data.auth_url) {
                    window.open(data.auth_url, '_blank');
                } else {
                    window.RFQAgentAPI.showToast('Could not get authentication URL', 'error');
                }
            } catch (error) {
                console.error('[Settings] Outlook OAuth Error:', error);
                window.RFQAgentAPI.showToast('API Connection Error', 'error');
            }
        }

        // Load OAuth status on page load
        document.addEventListener('DOMContentLoaded', async () => {
            console.log('[Settings] Settings page loaded, checking OAuth status...');

            // ===== CHECK OUTLOOK STATUS =====
            try {
                const outlookStatus = await window.RFQAgentAPI.getOAuthStatus();
                console.log('[Settings] Outlook OAuth Status:', outlookStatus);

                const outlookStatusDot = document.getElementById('outlookStatus');
                const outlookBtn = document.querySelector('button[onclick="viewOutlookSettings()"]');

                if (outlookStatus.status === 'connected') {
                    outlookStatusDot.className = 'status-online-large';
                    if (outlookBtn) {
                        outlookBtn.textContent = 'Connected';
                        outlookBtn.className = 'btn btn-secondary btn-sm';
                    }
                } else if (outlookStatus.status === 'unauthorized') {
                    outlookStatusDot.className = 'status-offline-large';
                    outlookStatusDot.title = 'Token expired. Please reconnect.';
                    if (outlookBtn) {
                        outlookBtn.textContent = 'Reconnect';
                        outlookBtn.className = 'btn btn-primary btn-sm';
                    }
                } else {
                    outlookStatusDot.className = 'status-offline-large';
                    if (outlookBtn) {
                        outlookBtn.textContent = 'Connect';
                        outlookBtn.className = 'btn btn-primary btn-sm';
                    }
                }
            } catch (error) {
                console.error('[Settings] Could not fetch Outlook OAuth status:', error);
            }

            // ===== CHECK GMAIL STATUS =====
            try {
                const gmailResponse = await fetch(API_BASE + '/api/gmail/oauth/status');
                const gmailStatus = await gmailResponse.json();
                console.log('[Settings] Gmail OAuth Status:', gmailStatus);

                const gmailStatusDot = document.getElementById('gmailStatus');
                const gmailBtn = document.querySelector('button[onclick="configureGmail()"]');

                // Gmail API returns {authenticated: true/false} format
                if (gmailStatus.authenticated === true || gmailStatus.status === 'connected') {
                    gmailStatusDot.className = 'status-online-large';
                    if (gmailBtn) {
                        gmailBtn.textContent = 'Connected';
                        gmailBtn.className = 'btn btn-secondary btn-sm';
                    }
                } else {
                    gmailStatusDot.className = 'status-offline-large';
                    if (gmailBtn) {
                        gmailBtn.textContent = 'Connect';
                        gmailBtn.className = 'btn btn-primary btn-sm';
                    }
                }
            } catch (error) {
                console.error('[Settings] Could not fetch Gmail OAuth status:', error);
            }
        });
    </script>
